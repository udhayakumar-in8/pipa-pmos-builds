name: Xiaomi Pad 6 postmarketOS
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 5' # Start build every friday

jobs:
  build-image:
    strategy:
      matrix:
        version: ["default"]

    runs-on: ubuntu-latest
    steps:
      - name: Check out build configurations
        uses: actions/checkout@v4

      - name: Set current date variable
        run: echo "CURRENT_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
        
      - name: Create artifact directory
        run: |
            mkdir out
        
      - name: Substitute placeholders in configs
        run: |
           find . -type f -name "*.cfg" -exec sed -i "s|HOME|$(echo $HOME)|;s|NPROC|$(nproc)|" {} +

      - name: Install pmbootstrap from git
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p ~/.local/bin
          ln -s "$PWD/pmbootstrap/pmbootstrap.py" ~/.local/bin/pmbootstrap
          pmbootstrap --version

      - name: Set up pmaports
        run: |
          echo -e '\n\n' | pmbootstrap init || true
          cd ~/.local/var/pmbootstrap/cache_git/pmaports
          # Use the real v25.06 release branch so the recipes match the
          # v25.06 binary repo. rifux/pipa-pmaports "v25.06" is an older edge
          # snapshot, and mixing it with the binary repo breaks mkinitfs.
          git fetch origin v25.06
          git reset --hard origin/v25.06
          # Take only the pipa packages from the fork
          git remote add pipa https://github.com/rifux/pipa-pmaports.git
          git fetch pipa v25.06
          find device -mindepth 2 -maxdepth 2 -type d -name '*-pipa' -exec rm -rf {} +
          git checkout pipa/v25.06 -- \
            device/testing/device-xiaomi-pipa \
            device/testing/firmware-xiaomi-pipa \
            device/testing/linux-postmarketos-qcom-sm8250-pipa

      - name: Apply screen rotation fix to device-xiaomi-pipa
        run: |
          cp xiaomi-pipa.cfg ~/.config/pmbootstrap_v3.cfg
          git -C ~/.local/var/pmbootstrap/cache_git/pmaports apply "$GITHUB_WORKSPACE/patches/device-xiaomi-pipa-rotation.patch"
          pmbootstrap checksum device-xiaomi-pipa

      - name: Build the xiaomi-pipa with GNOME
        run: |
           # pmbootstrap does not build this on its own, so the
           # firmware-xiaomi-pipa-* subpackages the device needs are missing
           pmbootstrap build --force --arch aarch64 firmware-xiaomi-pipa
           pmbootstrap install --password 147147 --add postmarketos-ui-gnome
           pmbootstrap export
           cp /tmp/postmarketOS-export/boot.img out/boot-xiaomi-pipa.img
           cp /tmp/postmarketOS-export/xiaomi-pipa.img out/rootfs-xiaomi-pipa-gnome.img

      - name: Show pmbootstrap log on failure
        if: failure()
        run: tail -n 300 ~/.local/var/pmbootstrap/log.txt

      - name: Breakpoint if tests failed for xiaomi-pipa with GNOME
        if: failure()
        uses: namespacelabs/breakpoint-action@v0
        with:
          duration: 30m
          authorized-users: udhayakumar-in8
            
      - name: Upload artifacts xiaomi-pipa with GNOME
        uses: actions/upload-artifact@v4
        with:
           name: xiaomi-pipa-gnome_${{ env.CURRENT_DATE }}
           path: out/*.img*
           retention-days: 7
                       
      - name: Copy xiaomi-pipa kernel
        run: |
           rm -r out/*
           cp ~/.local/var/pmbootstrap/packages/v25.06/aarch64/linux-postmarketos-qcom-sm8250-pipa-*.apk out/
      
      - name: Upload artifacts xiaomi-pipa kernel
        uses: actions/upload-artifact@v4
        with:
           name: xiaomi-pipa-kernel_${{ env.CURRENT_DATE }}
           path: out/*.apk
           retention-days: 7
